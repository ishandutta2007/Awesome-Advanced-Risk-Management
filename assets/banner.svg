<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#111c35" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* CSS Animations */
    @keyframes pulse-radar {
      0% { r: 10px; opacity: 0.8; }
      50% { r: 90px; opacity: 0.3; }
      100% { r: 160px; opacity: 0; }
    }
    @keyframes sweep-line {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse-orb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .radar-pulse-1 {
      animation: pulse-radar 4s ease-out infinite;
      transform-origin: 1080px 200px;
    }
    .radar-pulse-2 {
      animation: pulse-radar 4s ease-out infinite;
      animation-delay: 2s;
      transform-origin: 1080px 200px;
    }
    .radar-sweep {
      animation: sweep-line 8s linear infinite;
      transform-origin: 1080px 200px;
    }
    .floating-card-1 {
      animation: float-node 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: float-node 7s ease-in-out infinite 1s;
    }
    .floating-card-3 {
      animation: float-node 5s ease-in-out infinite 2s;
    }
    .pulsing-orb {
      animation: pulse-orb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .animated-grid-line {
      stroke-dasharray: 6 6;
      animation: dash 2s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="400" fill="url(#bg-grad)" />

  <!-- Subtle Animated Ambient Glow in Background -->
  <circle class="pulsing-orb" cx="180" cy="120" r="160" fill="#6366f1" filter="url(#glow)" opacity="0.25" />
  <circle class="pulsing-orb" cx="1100" cy="220" r="200" fill="#0284c7" filter="url(#glow)" opacity="0.2" />

  <!-- Grid overlay -->
  <rect width="1280" height="400" fill="url(#grid)" />

  <!-- Decorative Matrix / Radar Element on the Right Side (Non-overlapping) -->
  <g id="radar-container" transform="translate(1080, 200)">
    <!-- Radar concentric rings -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- Animated radar pulse waves -->
    <circle class="radar-pulse-1" cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle class="radar-pulse-2" cx="0" cy="0" r="10" fill="none" stroke="#6366f1" stroke-width="1.5" />

    <!-- Radar Crosshairs -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Rotating Sweep Scanner -->
    <g class="radar-sweep">
      <defs>
        <linearGradient id="sweep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path d="M 0 0 L 130 -40 A 136 136 0 0 1 136 0 Z" fill="url(#sweep-grad)" />
      <line x1="0" y1="0" x2="136" y2="0" stroke="#38bdf8" stroke-width="2" filter="url(#soft-glow)" />
    </g>

    <!-- Risk Data Blips / Nodes -->
    <circle cx="50" cy="-60" r="4" fill="#ef4444" filter="url(#soft-glow)" />
    <text x="60" y="-56" font-family="sans-serif" font-size="10" fill="#ef4444" font-weight="bold">CRITICAL</text>
    
    <circle cx="-70" cy="40" r="4" fill="#f59e0b" filter="url(#soft-glow)" />
    <text x="-65" y="55" font-family="sans-serif" font-size="10" fill="#f59e0b" font-weight="bold">HIGH</text>

    <circle cx="85" cy="45" r="4" fill="#10b981" filter="url(#soft-glow)" />
    <text x="95" y="49" font-family="sans-serif" font-size="10" fill="#10b981" font-weight="bold">SAFE</text>
  </g>

  <!-- Animated Risk Flow Diagram Connections -->
  <path class="animated-grid-line" d="M 80 340 L 450 340" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- Primary Foreground Content (Left & Center aligned) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" filter="url(#soft-glow)" />
      <text x="32" y="19" class="tagline-text">ENTERPRISE RISK &amp; GRC INTEL</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 135)">
      <text class="title-text">
        Awesome Advanced Risk Management
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 178)">
      <text class="subtitle-text">
        Curated SaaS Platforms, Quantitative Engines, Frameworks &amp; Open-Source Risk Tools
      </text>
    </g>

    <!-- Secondary Meta Description -->
    <g transform="translate(0, 212)">
      <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#64748b" font-weight="400">
        Transparent SaaS Pricing &bull; Free Tier Audits &bull; Market Dynamics &bull; Star-Ranked Codebases
      </text>
    </g>

    <!-- Floating Interactive Feature Badges / Cards -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: Enterprise GRC -->
      <g class="floating-card-1" transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <rect width="4" height="42" rx="2" fill="#38bdf8" />
        <text x="20" y="26" class="pill-text">🛡️ Enterprise GRC</text>
      </g>

      <!-- Pill 2: Financial & Quant Risk -->
      <g class="floating-card-2" transform="translate(195, 0)">
        <rect width="200" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <rect width="4" height="42" rx="2" fill="#6366f1" />
        <text x="20" y="26" class="pill-text">📈 Quant &amp; Market Risk</text>
      </g>

      <!-- Pill 3: Cyber & Threat Intel -->
      <g class="floating-card-3" transform="translate(410, 0)">
        <rect width="205" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <rect width="4" height="42" rx="2" fill="#10b981" />
        <text x="20" y="26" class="pill-text">🔍 Cyber Threat &amp; SIEM</text>
      </g>

      <!-- Pill 4: AI Risk & Guardrails -->
      <g class="floating-card-1" transform="translate(630, 0)">
        <rect width="195" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <rect width="4" height="42" rx="2" fill="#f59e0b" />
        <text x="20" y="26" class="pill-text">🤖 AI Guardrails &amp; LLM</text>
      </g>
    </g>

    <!-- Bottom Accent Line -->
    <line x1="0" y1="350" x2="840" y2="350" stroke="url(#primary-glow)" stroke-width="2" opacity="0.8" />
  </g>
</svg>
